name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend - lint, typecheck y unit tests
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Regenerar cliente de Prisma
        run: pnpm exec prisma generate

      - name: Lint
        # La base actual aún contiene deuda de lint; se reporta sin bloquear
        # typecheck ni pruebas hasta que exista un baseline limpio.
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file#backend/}")
          done < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- ':(top,glob)backend/src/**/*.ts' ':(top,glob)backend/test/**/*.ts')

          if ((${#files[@]})); then
            pnpm exec eslint "${files[@]}"
          else
            echo "No hay archivos TypeScript modificados para validar."
          fi

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec jest --runInBand
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          AT_SECRET: test-access-secret
          RT_SECRET: test-refresh-secret
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FE_URL: http://localhost:5173
          COOKIE_KEY: test-cookie-key
          EMAIL: test@example.com
          EMAIL_KEY: test-email-key
          SMTP_HOST: localhost
          SMTP_PORT: 465
          PLANIFICATOR_AI_HOST: http://localhost:8000

  frontend-check:
    name: Frontend - lint y typecheck
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  backend-build:
    name: Backend - build
    if: github.event_name == 'push'
    runs-on: [self-hosted, coolify]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  frontend-build:
    name: Frontend - build
    if: github.event_name == 'push'
    runs-on: [self-hosted, coolify]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
